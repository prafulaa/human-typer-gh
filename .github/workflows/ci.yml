name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint & Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pyflakes
        run: python -m pip install pyflakes

      - name: Compile check
        run: python -m py_compile human_typer.py human_typer_gui.py ui_kit.py create_icon.py

      - name: Pyflakes
        run: python -m pyflakes human_typer.py human_typer_gui.py ui_kit.py create_icon.py

      - name: Engine tests (stubbed pyautogui - no real keystrokes)
        run: python tests/test_engine.py

      - name: CLI argument validation tests
        shell: bash
        run: |
          python human_typer.py --help > /dev/null
          if python human_typer.py --wpm 0 -t hi > /dev/null 2>&1; then
            echo "FAIL: --wpm 0 was accepted"; exit 1
          fi
          if python human_typer.py --error-rate 5 -t hi > /dev/null 2>&1; then
            echo "FAIL: --error-rate 5 was accepted"; exit 1
          fi
          echo "CLI validation OK"
