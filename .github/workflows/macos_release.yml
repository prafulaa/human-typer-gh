name: Build macOS App

# Builds the .app bundle on every v* tag (or manually). The artifact is
# uploaded unsigned. Developer ID signing + notarization only run when the
# required secrets are configured - see the "Sign & Notarize" job below.
#
# NOTE: this app is NOT App Store compatible. It types into other
# applications via CGEvents, which requires Accessibility permission and
# cannot run inside the App Store sandbox. Distribute as a signed+notarized
# Developer ID .app/.dmg instead (what this workflow does).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Human Typer.app
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate macOS ICNS icon
        run: python create_icon.py

      - name: Build macOS App Bundle with PyInstaller
        run: pyinstaller HumanTyper.spec --noconfirm

      - name: Zip .app for artifact (preserves permissions)
        run: ditto -c -k --keepParent "dist/Human Typer.app" "HumanTyper-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HumanTyper-macOS
          path: HumanTyper-macOS.zip

  sign-notarize:
    name: Sign & Notarize (optional)
    needs: build
    runs-on: macos-latest
    # Runs only on tag pushes and only when the P12 secret is configured;
    # otherwise the unsigned artifact from the build job is the deliverable.
    if: ${{ github.event_name == 'push' }}
    env:
      CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}  # e.g. "Developer ID Application: Name (TEAMID)"
      APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
      ASC_APP_SPECIFIC_PASSWORD: ${{ secrets.ASC_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: HumanTyper-macOS

      - name: Unzip .app
        run: ditto -x -k HumanTyper-macOS.zip .

      - name: Import signing certificate
        if: env.CERT_P12_BASE64 != ''
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=temporary
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Code sign with Developer ID
        if: env.CERT_P12_BASE64 != ''
        run: |
          codesign --force --deep --sign "$SIGN_IDENTITY" --options runtime "dist/Human Typer.app"
          codesign -vvv --strict "dist/Human Typer.app"

      - name: Notarize & staple
        if: env.CERT_P12_BASE64 != ''
        run: |
          ditto -c -k --keepParent "dist/Human Typer.app" HumanTyper-macOS-signed.zip
          xcrun notarytool submit HumanTyper-macOS-signed.zip \
            --apple-id "$APPLE_ID_EMAIL" --password "$ASC_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "dist/Human Typer.app"

      - name: Upload signed artifact
        if: env.CERT_P12_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: HumanTyper-macOS-signed
          path: HumanTyper-macOS-signed.zip
